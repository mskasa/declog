version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
  settings:
    errcheck:
      # Don't require error checks on fmt.Fprint* (CLI output) or file/body Close.
      # Closing a read-only *os.File or an HTTP response body is a best-effort
      # operation whose error is not actionable in practice.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (io.ReadCloser).Close
  exclusions:
    rules:
      # Test files are allowed to use t.Fatal without checking errors
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
