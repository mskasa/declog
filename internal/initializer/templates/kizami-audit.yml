name: kizami Audit

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.22'
      - name: Install kizami
        run: go install github.com/mskasa/kizami@latest
      - name: Run kizami audit
        id: audit
        run: |
          output=$(kizami audit 2>&1)
          echo "$output"
          if echo "$output" | grep -q "Stale path references detected"; then
            echo "stale_found=true" >> "$GITHUB_OUTPUT"
            {
              echo 'AUDIT_RESULT<<EOF'
              echo "$output"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          else
            echo "stale_found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub Issue if stale documents found
        if: steps.audit.outputs.stale_found == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = `[kizami audit] Stale file references detected (${new Date().toISOString().slice(0, 10)})`;
            const body = process.env.AUDIT_RESULT;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });
            const duplicate = existing.data.find(i => i.title.includes('[kizami audit]'));
            if (!duplicate) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
